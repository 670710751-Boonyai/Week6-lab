name: MovieHub Go checks
on:
  push:
    paths:
      - 'moviehub/**'
      - '.github/workflows/moviehub-go.yml'
  pull_request:
    paths:
      - 'moviehub/**'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moviehub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: moviehub/go.mod
          cache-dependency-path: moviehub/go.sum
      - run: gofmt -l main.go auth handler mw store | tee /tmp/gofmt-report.txt
      - run: go test ./...
      - run: go vet ./...
